<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хэллоуин: Хронология Проклятия</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Russo One', sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; background: #2a0a38;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
}

#bg-spiral {
    position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: repeating-radial-gradient(circle at center,
        #f26d21 0px, #f26d21 60px, #572a7c 60px, #572a7c 120px);
    animation: spin 25s linear infinite;
    filter: blur(12px); z-index: -1;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

.game-container {
    background: rgba(25, 0, 40, 0.93);
    padding: 16px;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 25px rgba(242,109,33,0.4);
    max-width: 640px; width: 100%;
    backdrop-filter: blur(6px);
    border: 3px solid #f26d21; z-index: 1;
    max-height: 96vh; overflow-y: auto;
    text-align: center;
}

h1 {
    color: #f26d21; font-size: 24px; margin-bottom: 6px;
    text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000;
    letter-spacing: 2px;
    animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow {
    from { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 10px #f26d21; }
    to { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 25px #f26d21; }
}
.hint {
    color: #ccc; font-size: 12px; letter-spacing: 1px;
    margin-bottom: 14px;
}

/* Ячейки */
.slots {
    display: flex; flex-direction: column; gap: 4px;
    margin-bottom: 14px;
}
.slot-row {
    display: flex; align-items: center; gap: 8px;
}
.slot-num {
    color: #f26d21; font-size: 14px; min-width: 20px;
    text-shadow: 1px 1px 0 #000;
}
.slot {
    flex: 1; min-height: 44px;
    background: rgba(15, 2, 25, 0.85);
    border: 2px dashed rgba(242,109,33,0.5);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    padding: 6px 10px;
    color: #666; font-size: 12px;
    letter-spacing: 1px;
    transition: all 0.25s ease;
    cursor: pointer;
    text-align: left;
}
.slot.over {
    border-color: #f26d21; background: rgba(242,109,33,0.15);
    box-shadow: 0 0 15px rgba(242,109,33,0.6);
    transform: scale(1.02);
}
.slot.filled {
    border: 2px solid #f26d21;
    background: rgba(87, 42, 124, 0.55);
    color: #fff; font-size: 12px;
    justify-content: flex-start;
}
.slot.correct {
    border-color: #4caf50; background: rgba(76,175,80,0.25);
    box-shadow: 0 0 15px rgba(76,175,80,0.6);
}
.slot.wrong {
    border-color: #ff3333; background: rgba(255,51,51,0.25);
    box-shadow: 0 0 15px rgba(255,51,51,0.6);
    animation: shake 0.4s ease;
}
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}
.arrow {
    color: #f26d21; font-size: 16px; margin-left: 28px;
    text-shadow: 0 0 8px #f26d21;
    height: 10px; line-height: 10px;
}

/* События внизу */
.events-title {
    color: #f26d21; font-size: 13px; letter-spacing: 2px;
    text-shadow: 1px 1px 0 #000; margin-bottom: 8px;
}
.events {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    padding: 10px; background: rgba(87,42,124,0.3);
    border: 2px dashed rgba(242,109,33,0.4);
    border-radius: 12px; min-height: 60px;
    margin-bottom: 12px;
}
.event {
    background: rgba(242, 109, 33, 0.2);
    border: 2px solid #f26d21; border-radius: 10px;
    padding: 8px 12px; color: #fff; font-size: 12px;
    cursor: grab; letter-spacing: 0.5px;
    text-shadow: 1px 1px 1px #000;
    transition: all 0.2s ease;
    max-width: 100%;
    touch-action: none;
}
.event:hover {
    background: rgba(242, 109, 33, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 0 12px rgba(242,109,33,0.6);
}
.event.selected {
    border-color: #fff;
    background: rgba(242, 109, 33, 0.5);
    box-shadow: 0 0 15px #fff;
    transform: scale(1.05);
}
.event.dragging { opacity: 0.5; }

/* Кнопка */
.controls { display: flex; gap: 10px; justify-content: center; }
.btn {
    font-family: 'Russo One', sans-serif; font-size: 14px;
    background: #572a7c; color: #f26d21;
    border: 3px solid #f26d21; padding: 10px 20px;
    border-radius: 12px; cursor: pointer;
    letter-spacing: 1px; transition: all 0.3s ease;
    text-shadow: 1px 1px 0 #000;
}
.btn:hover:not(:disabled) {
    background: #f26d21; color: #572a7c;
    border-color: #572a7c;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(242,109,33,0.7);
}
.btn:active:not(:disabled) { transform: scale(0.95); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.hint-msg {
    min-height: 18px; font-size: 12px; letter-spacing: 1px;
    color: #f26d21; margin-top: 8px;
    text-shadow: 1px 1px 0 #000;
}
.hint-msg.good { color: #4caf50; }
.hint-msg.warn { color: #ff5555; }

/* Финальный экран */
.end-screen {
    display: none; flex-direction: column; align-items: center;
    gap: 14px; padding: 20px 10px;
    animation: fadeIn 0.8s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.end-screen h1 { font-size: 22px; line-height: 1.3; }
.end-screen p { color: #fff; font-size: 14px; letter-spacing: 1px; }
.end-screen p.sub { color: #ccc; font-size: 12px; }
.end-screen p.final {
    color: #f26d21; font-size: 14px;
    text-shadow: 1px 1px 0 #000, 0 0 10px #f26d21;
}

@media (max-width: 600px) {
    h1 { font-size: 18px; }
    .slot { min-height: 38px; font-size: 11px; padding: 5px 8px; }
    .slot.filled { font-size: 11px; }
    .event { font-size: 11px; padding: 6px 9px; }
    .slot-num { font-size: 12px; min-width: 16px; }
    .arrow { font-size: 13px; margin-left: 22px; height: 8px; line-height: 8px; }
    .btn { font-size: 12px; padding: 8px 16px; }
    .end-screen h1 { font-size: 17px; }
    .end-screen p { font-size: 12px; }
}
</style>
</head>
<body>

<div id="bg-spiral"></div>

<div class="game-container" id="game-container">

    <div id="main-screen">
        <h1>Хронология Проклятия</h1>
        <p class="hint">Перетащи события в правильном порядке</p>

        <div class="slots" id="slots"></div>

        <div class="events-title">СОБЫТИЯ</div>
        <div class="events" id="events"></div>

        <div class="controls">
            <button class="btn" id="check-btn" onclick="checkAnswer()" disabled>Проверить</button>
        </div>

        <div class="hint-msg" id="hint-msg"></div>
    </div>

    <div class="end-screen" id="end-screen">
        <h1>ПОЗДРАВЛЯЕМ! 🎃</h1>
        <p class="sub">Ты восстановил хронологию проклятия</p>
        <p>Все 7 событий — в правильном порядке!</p>
        <p class="final">Не забудь отправить скрин в группу!</p>
    </div>

</div>

<script>
    // ===== СОБЫТИЯ (правильный порядок) =====
    const EVENTS = [
        { id: 1, text: '🦭 Рождение Мити' },
        { id: 2, text: '🎃 Обращение Мити в Тыкву' },
        { id: 3, text: '💀 Опущение тыквы в подземелье Скелетов' },
        { id: 4, text: '📝 Записка о помощи' },
        { id: 5, text: '🌀 Пробуждение Тыквы Владом, Викой, Аней и другими' },
        { id: 6, text: '🧸 Обращение всех участников Чата Тюленчика в кукл вуду' },
        { id: 7, text: '🔗 Заточение всех участников Чата Тюленчика в «Кошмарные Сети»' }
    ];

    let slots = new Array(7).fill(null);
    let selectedEventId = null;

    // ===== СТАРТ =====
    function init() {
        slots = new Array(7).fill(null);
        selectedEventId = null;
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('main-screen').style.display = 'block';
        renderSlots();
        renderEvents();
        updateCheckButton();
    }

    // ===== СЛОТЫ =====
    function renderSlots() {
        const container = document.getElementById('slots');
        container.innerHTML = '';
        for (let i = 0; i < 7; i++) {
            const row = document.createElement('div');
            row.className = 'slot-row';

            const num = document.createElement('div');
            num.className = 'slot-num';
            num.textContent = (i + 1);
            row.appendChild(num);

            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.dataset.index = i;

            const eventId = slots[i];
            if (eventId !== null) {
                slot.classList.add('filled');
                const ev = EVENTS.find(e => e.id === eventId);
                slot.textContent = ev.text;
                slot.addEventListener('click', () => removeFromSlot(i));
            } else {
                slot.textContent = '...перетащи сюда...';
            }

            // Drag & drop
            slot.addEventListener('dragover', (e) => {
                e.preventDefault();
                slot.classList.add('over');
            });
            slot.addEventListener('dragleave', () => slot.classList.remove('over'));
            slot.addEventListener('drop', (e) => {
                e.preventDefault();
                slot.classList.remove('over');
                const eventId = parseInt(e.dataTransfer.getData('text/plain'));
                placeInSlot(eventId, i);
            });

            // Клик по слоту
            slot.addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedEventId !== null && slots[i] === null) {
                    placeInSlot(selectedEventId, i);
                    selectedEventId = null;
                    updateSelectedStyling();
                }
            });

            row.appendChild(slot);
            container.appendChild(row);

            // Стрелка (кроме последнего)
            if (i < 6) {
                const arrow = document.createElement('div');
                arrow.className = 'arrow';
                arrow.textContent = '▼';
                container.appendChild(arrow);
            }
        }
    }

    // ===== СОБЫТИЯ =====
    function renderEvents() {
        const container = document.getElementById('events');
        container.innerHTML = '';

        const placedIds = slots.filter(s => s !== null);
        const available = EVENTS.filter(e => !placedIds.includes(e.id));

        if (!container.dataset.shuffled) {
            available.sort(() => Math.random() - 0.5);
            container.dataset.shuffled = '1';
            container._order = available.map(e => e.id);
        } else {
            const order = container._order || [];
            available.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
        }

        available.forEach(ev => {
            const el = document.createElement('div');
            el.className = 'event';
            el.textContent = ev.text;
            el.dataset.id = ev.id;
            el.setAttribute('draggable', 'true');

            if (selectedEventId === ev.id) el.classList.add('selected');

            el.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', ev.id.toString());
                el.classList.add('dragging');
            });
            el.addEventListener('dragend', () => el.classList.remove('dragging'));

            el.addEventListener('click', () => {
                if (selectedEventId === ev.id) {
                    selectedEventId = null;
                } else {
                    selectedEventId = ev.id;
                }
                updateSelectedStyling();
            });

            container.appendChild(el);
        });
    }

    function updateSelectedStyling() {
        document.querySelectorAll('.event').forEach(el => {
            el.classList.toggle('selected', parseInt(el.dataset.id) === selectedEventId);
        });
    }

    // ===== ПОСТАВИТЬ =====
    function placeInSlot(eventId, slotIndex) {
        if (slots[slotIndex] !== null) return;
        for (let i = 0; i < slots.length; i++) {
            if (slots[i] === eventId) slots[i] = null;
        }
        slots[slotIndex] = eventId;
        renderSlots();
        renderEvents();
        updateCheckButton();
    }

    function removeFromSlot(slotIndex) {
        slots[slotIndex] = null;
        renderSlots();
        renderEvents();
        updateCheckButton();
    }

    function updateCheckButton() {
        const allFilled = slots.every(s => s !== null);
        document.getElementById('check-btn').disabled = !allFilled;
    }

    // ===== ПРОВЕРКА =====
    function checkAnswer() {
        let allCorrect = true;
        for (let i = 0; i < 7; i++) {
            if (slots[i] !== EVENTS[i].id) {
                allCorrect = false;
                break;
            }
        }

        const slotEls = document.querySelectorAll('.slot');

        if (allCorrect) {
            slotEls.forEach(el => el.classList.add('correct'));
            showHint('Всё верно!', 'good');
            setTimeout(() => {
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('end-screen').style.display = 'flex';
            }, 1200);
        } else {
            slotEls.forEach((el, i) => {
                el.classList.remove('correct', 'wrong');
                if (slots[i] === EVENTS[i].id) {
                    el.classList.add('correct');
                } else {
                    el.classList.add('wrong');
                }
            });
            showHint('Не всё верно — красные ячейки стоят не на месте', 'warn');
            setTimeout(() => {
                slotEls.forEach(el => el.classList.remove('correct', 'wrong'));
            }, 2000);
        }
    }

    // ===== ПОДСКАЗКА =====
    let hintTimeout = null;
    function showHint(text, type) {
        const el = document.getElementById('hint-msg');
        el.textContent = text;
        el.className = 'hint-msg ' + (type || '');
        if (hintTimeout) clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => { el.textContent = ''; }, 2500);
    }

    init();
</script>

</body>
</html>
